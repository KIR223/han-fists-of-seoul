name: build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Кэш бинарников vcpkg
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Каталог кэша
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Привести vcpkg к baseline
        # Файлы версий встроенного реестра vcpkg читает из рабочей копии, поэтому её нужно перевести на baseline из vcpkg.json,
        # а утилиту пересобрать под эту ревизию.
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_ROOT fetch --quiet origin master
          git -C $env:VCPKG_ROOT checkout --quiet $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg завершился с кодом $LASTEXITCODE" }
      - name: Конфигурация (Release)
        run: cmake --preset windows-release
      - name: Сборка
        run: cmake --build --preset windows-release --parallel
      - name: Тесты
        run: ctest --preset windows-release --no-tests=error
