name: build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Кэш бинарников vcpkg
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Каталог кэша
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Обновить vcpkg до baseline
        shell: pwsh
        run: |
          git -C $env:VCPKG_ROOT fetch --quiet origin master
          git -C $env:VCPKG_ROOT cat-file -e 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
      - name: Конфигурация (Release)
        run: cmake --preset windows-release
      - name: Сборка
        run: cmake --build --preset windows-release --parallel
      - name: Тесты
        run: ctest --preset windows-release --no-tests=error
