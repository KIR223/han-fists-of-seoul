name: contract-notify

on:
  pull_request:
    types: [closed]
    paths: ["contracts/**"]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Issue «Контракт изменился»
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/contract_issue.py ${{ github.event.pull_request.number }}
