name: notify-failure

on:
  workflow_run:
    workflows: [repo-check, build, weekly-build]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Сообщение о падении проверки
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WF: ${{ github.event.workflow_run.name }}
          BR: ${{ github.event.workflow_run.head_branch }}
          WHO: ${{ github.event.workflow_run.actor.login }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 tools/ci/notify.py "❌ HAN: проверка «$WF» упала в ветке $BR (запускал $WHO). Подробности: $URL"
